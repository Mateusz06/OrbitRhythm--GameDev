<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Orbit Rhythm</title>
	<style type="text/css">
html, body
{
	background-color: #0a0a12;
	margin: 0;
	height: 100%;
	min-height: 100dvh;
	overflow: hidden;
	font-family: sans-serif;
	font-size: 18px;
}
body
{
	display: flex;
	flex-direction: column;
}
#wrapper
{
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	flex: 1;
	min-height: 0;
	padding: 0;
	margin: 0;
}
#title
{
	background-color: #ea316e;
	margin: 0;
	padding: .35em .6em;
	border: none;
	border-bottom: 1px solid rgba(0,0,0,0.35);
	box-shadow: none;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 0.75em;
	flex-wrap: wrap;
	color: #f5f5f5;
	flex-shrink: 0;
}
#title h1 {
	margin: 0;
	font-size: clamp(1rem, 3.5vw, 1.35rem);
	font-weight: 700;
}
#fs-toggle {
	cursor: pointer;
	font: inherit;
	font-size: 0.85rem;
	padding: 0.35em 0.75em;
	border-radius: 8px;
	border: 1px solid rgba(0,0,0,0.35);
	background: rgba(255,255,255,0.15);
	color: #f5f5f5;
	box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
}
#fs-toggle:hover { background: rgba(255,255,255,0.28); }
#main
{
	background-color: #000;
	margin: 0;
	padding: 0;
	flex: 1;
	min-height: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	border: none;
	border-radius: 0;
	box-shadow: none;
}
#main canvas
{
	display: block;
	background: #000 !important;
	max-width: 100%;
	max-height: 100%;
	width: auto;
	height: auto;
	aspect-ratio: 800 / 600;
	object-fit: contain;
}
#main:fullscreen,
#main:-webkit-full-screen
{
	width: 100%;
	height: 100%;
}
#main:fullscreen canvas,
#main:-webkit-full-screen canvas
{
	max-width: 100vw;
	max-height: 100vh;
	width: min(100vw, calc(100dvh * 800 / 600));
	height: min(100dvh, calc(100vw * 600 / 800));
}
#footer
{
	background-color: #1a1a24;
	padding: 6px 8px;
	min-height: 28px;
	box-sizing: border-box;
	border-top: 1px solid #333;
	color: #aaa;
	font-size: 9pt;
	text-align: center;
	flex-shrink: 0;
}
#footer a { color: #7ad; }
#footer a:hover, #footer a:active { color: #ea316e; }
@media (max-width: 850px)
{
	#wrapper { font-size: 90%; }
}
	</style>
</head>
<body>
<div id="wrapper">
	<header id="title">
		<h1>Orbit Rhythm</h1>
		<button type="button" id="fs-toggle" title="Volledig scherm (Escape om te sluiten)">Volledig scherm</button>
	</header>
	<div id="main">
		<canvas id="canvas" width="800" height="600"></canvas>
	</div>
</div>
<div id="footer">Made using the <a href="https://love2d.org/" target="_blank">LÖVE Framework</a> (<a href="https://raw.githubusercontent.com/love2d/love/main/license.txt" target="_blank">License</a>) &middot; Packaged using <a href="https://schellingb.github.io/LoveWebBuilder/" target="_blank">LÖVE Web Builder</a></div>
<script type="text/javascript">(function(){
var TXT =
{
	PLAYBTN: 'Click here to launch the game',
	LOAD:    'Downloading Game',
	PARSE:   'Preparing Game',
	EXECUTE: 'Starting Game',
	DLERROR: 'Error while downloading game data.\nCheck your internet connection.',
	NOWEBGL: 'Your browser or graphics card does not seem to support <a href="http://khronos.org/webgl/wiki/Getting_a_WebGL_Implementation">WebGL</a>.<br>Find out how to get it <a href="http://get.webgl.org/">here</a>.',
};
var canvas = document.getElementById('canvas'), ctx;
var mainEl = document.getElementById('main');
var fsBtn = document.getElementById('fs-toggle');
var getFullscreenElement = function()
{
	return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
};
var syncFsLabel = function()
{
	if (!fsBtn) return;
	var fs = !!getFullscreenElement();
	fsBtn.textContent = fs ? 'Volledig scherm uit' : 'Volledig scherm';
	fsBtn.setAttribute('aria-pressed', fs ? 'true' : 'false');
};
var toggleFullscreen = function()
{
	var target = mainEl || document.documentElement;
	if (!getFullscreenElement())
	{
		var req = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
		if (req) req.call(target).catch(function() {});
	}
	else
	{
		var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
		if (ex) ex.call(document);
	}
};
if (fsBtn) fsBtn.addEventListener('click', function(e) { e.preventDefault(); toggleFullscreen(); });
document.addEventListener('fullscreenchange', syncFsLabel);
document.addEventListener('webkitfullscreenchange', syncFsLabel);
syncFsLabel();
var Msg = function(m)
{
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	ctx.fillStyle = '#888';
	for (var i = 0, a = m.split('\n'), n = a.length; i != n; i++)
		ctx.fillText(a[i], canvas.width/2, canvas.height/2-(n-1)*20+10+i*40);
};
var Fail = function(m)
{
	canvas.outerHTML = '<div style="max-width:90%;width:'+canvas.clientWidth+'px;height:'+canvas.clientHeight+'px;background:#000;display:table-cell;vertical-align:middle"><div style="background-color:#FFF;color:#000;padding:1.5em;max-width:640px;width:80%;margin:auto;text-align:center">'+TXT.NOWEBGL+(m?'<br><br>'+m:'')+'</div></div>';
};
var DoExecute = function()
{
	Msg(TXT.EXECUTE);
	Module.canvas = canvas.cloneNode(false);
	Module.canvas.oncontextmenu = function(e) { e.preventDefault() };
	Module.setWindowTitle = function(title) { };
	Module.postRun = function()
	{
		if (!Module.noExitRuntime) { Fail(); return; }
		canvas.parentNode.replaceChild(Module.canvas, canvas);
		Txt = Msg = ctx = canvas = null;
		Module.canvas.focus();
	};
	setTimeout(function() { Module.run(['/p']); }, 50);
};
var DoLoad = function()
{
	Msg(TXT.LOAD);
	var xhr = new XMLHttpRequest();
	xhr.open('GET', 'index.js');
	xhr.onprogress = function(e)
	{
		if (!e.lengthComputable || ctx.pCnt++ < 5) return;
		var x = canvas.width/2-150, y = canvas.height*.6, w = Math.min(e.loaded/e.total,1)*300, g = ctx.createLinearGradient(x,0,x+w,0);
		g.addColorStop(0,'#72d3ff');g.addColorStop(1,'#a2d4ea');
		ctx.fillStyle = '#1497ce'; ctx.fillRect(x-2,y-2,304,28);
		ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x  ,y  ,300,24);
		ctx.fillStyle = g;         ctx.fillRect(x  ,y  ,w,  24);
	};
	xhr.onerror = xhr.onabort = function() { Msg(TXT.DLERROR); canvas.disabled = false; };
	xhr.onload = function()
	{
		if (xhr.status != 200) { Msg(TXT.DLERROR + '<br>Status: ' + xhr.statusText ); canvas.disabled = false; return; }
		Msg(TXT.PARSE);
		setTimeout(function()
		{
			window.onerror = function(e,u,l) { Fail(e+'<br>('+u+':'+l+')'); };
			Module = { TOTAL_MEMORY: 1024*1024*24, TOTAL_STACK: 1024*1024*2, currentScriptUrl: '-', preInit: DoExecute };
			var s = document.createElement('script'), d = document.documentElement;
			s.textContent = xhr.response;
			d.appendChild(s);
			d.removeChild(s);
			xhr = xhr.response = s = s.textContent = null;
		},50);
	};
	xhr.send();
}
var DoSetup = function()
{
	canvas.onclick = function()
	{
		if (canvas.disabled) return;
		canvas.disabled = true;
		canvas.scrollIntoView();
		ctx.pCnt = 0;
		DoLoad();
	};
	ctx.fillStyle = '#888';
	ctx.fillRect(canvas.width/2-254, canvas.height/2-104, 508, 208);
	ctx.fillStyle = '#333';
	ctx.fillRect(canvas.width/2-250, canvas.height/2-100, 500, 200);
	ctx.fillStyle = '#888';
	ctx.fillText(TXT.PLAYBTN, canvas.width/2, canvas.height/2+10);
};
canvas.oncontextmenu = function(e) { e.preventDefault() };
ctx = canvas.getContext('2d');
ctx.font = '30px sans-serif';
ctx.textAlign = 'center';
DoSetup();
})()</script>
</body>
</html>
